<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – EDUPortal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="https://platforma-eduportal.pages.dev/themes/faviconeduportal.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--accent:#4b3bff;--accent2:#ff5fa2;--line:#b9c8f2;--lh:44px}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;background:#f5f5f7;font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.logo img{height:30px}

.notebook{position:relative;width:min(640px,100%);border-radius:10px 22px 22px 10px;background:#fff;box-shadow:0 30px 70px -28px #4b3bff55,0 2px 0 #0000000d;overflow:hidden;transform:rotate(-1.2deg)}
.holes{position:absolute;left:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:18px 0}
.holes i{width:16px;height:16px;border-radius:50%;background:#f5f5f7;box-shadow:inset 0 2px 3px #0000002e}
.sheet{margin-left:0;padding:var(--lh) 36px 0 92px;min-height:440px;
 background:
  linear-gradient(90deg,transparent 70px,#ff5f6d 70px,#ff5f6d 72px,transparent 72px),
  repeating-linear-gradient(transparent 0,transparent calc(var(--lh) - 2px),var(--line) calc(var(--lh) - 2px),var(--line) var(--lh));
 background-position:0 0,0 var(--lh);
}
.sheet h1,.sheet p,.sheet .row{font-family:Caveat,"Segoe Print",cursive;font-weight:700;color:#3a3a8a;line-height:var(--lh)}
.num{font-size:clamp(64px,14vw,104px);line-height:calc(var(--lh)*2)!important;color:var(--accent)!important;letter-spacing:.02em;position:relative;display:inline-block}
.num::after{content:"";position:absolute;left:-4px;right:-4px;top:54%;height:5px;border-radius:4px;background:#ff5f6d;transform:scaleX(0);transform-origin:left;animation:strike .6s 1.6s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes strike{to{transform:scaleX(1)}}
.sheet h1{font-size:clamp(28px,5.4vw,40px);margin-top:var(--lh)}
.sheet p{font-size:clamp(22px,4vw,28px);font-weight:500;margin-top:var(--lh);margin-bottom:0;max-width:30ch}
.sheet strong{background:linear-gradient(90deg,#4b3bff33,#ff5fa233) left bottom/100% 55% no-repeat;font-weight:700}
.write{display:block;clip-path:inset(0 100% 0 0);animation:write 1.1s steps(28) forwards}
.sheet h1.write{animation-delay:.2s}
.sheet p.write{animation-delay:1.1s;animation-duration:1.6s;clip-path:inset(0 100% 0 0)}
@keyframes write{to{clip-path:inset(0 0 0 0)}}

.cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:999px;font:600 16px Figtree,sans-serif;border:2px solid var(--ink);color:var(--ink);background:transparent;text-decoration:none;cursor:pointer;transition:color .35s,border-color .35s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.btn:hover,.btn:focus-visible{color:#fff;border-color:transparent}
.btn:hover::before,.btn:focus-visible::before{transform:scaleX(1)}
.btn.solid{background:var(--ink);color:#fff}

@media(max-width:480px){.sheet{padding-left:80px;padding-right:20px;min-height:400px}.holes{left:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.write{clip-path:none!important}.num::after{transform:scaleX(1)}}
</style>
</head>
<body>

<a class="logo" href="/" aria-label="Eduportal – strona główna"><img src="https://platforma-eduportal.pages.dev/themes/eduportal_logoczarne.svg" alt="Eduportal"></a>

<main class="notebook">
 <div class="holes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div class="sheet">
  <span class="row"><span class="num">404</span></span>
  <h1 class="write">Ta notatka nie została znaleziona,</h1>
  <p class="write">lecz na naszej platformie <strong>ją wygenerujesz!</strong></p>
 </div>
</main>

<div class="cta">
 <a class="btn solid" href="/">Wygeneruj notatkę</a>
 <a class="btn" href="https://platforma-eduportal.pages.dev/">Wróć na stronę główną</a>
</div>

</body>
</html>
